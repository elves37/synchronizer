# User Sync Platform default configuration
#
# Current architecture:
# - This DataSource stores both target_user and sync_* metadata tables.
# - Source DB connections are managed dynamically in the sync_source_db table.
#
# Environment variables can override every value below.

server.port=${SERVER_PORT:8080}

spring.application.name=user-sync-platform

# Target DB + Sync Metadata DB
spring.datasource.url=${SYNC_DB_URL:jdbc:postgresql://127.0.0.1:5432/target_db}
spring.datasource.username=${SYNC_DB_USERNAME:postgres}
spring.datasource.password=${SYNC_DB_PASSWORD:PGadmin11**}
spring.datasource.driver-class-name=${SYNC_DB_DRIVER:org.postgresql.Driver}

# HikariCP
spring.datasource.hikari.pool-name=user-sync-metadata-target-pool
spring.datasource.hikari.maximum-pool-size=${SYNC_DB_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${SYNC_DB_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${SYNC_DB_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.validation-timeout=${SYNC_DB_VALIDATION_TIMEOUT_MS:5000}
spring.datasource.hikari.idle-timeout=${SYNC_DB_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${SYNC_DB_MAX_LIFETIME_MS:1800000}

# SQL initialization
# Recommended for an existing/production DB: never
# For a new empty DB, set SYNC_SCHEMA_INIT_MODE=always once or execute db/target-schema.sql manually.
spring.sql.init.mode=${SYNC_SCHEMA_INIT_MODE:never}
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.continue-on-error=false

# Automatic synchronization dispatcher
# Each source stores its own N-minute interval and next_run_at in sync_source_config.
# The dispatcher only checks which sources are due; it does not define the per-source interval.
sync.scheduler.enabled=${SYNC_SCHEDULER_ENABLED:true}
sync.scheduler.dispatch-delay-ms=${SYNC_SCHEDULER_DISPATCH_DELAY_MS:10000}
sync.scheduler.batch-size=${SYNC_SCHEDULER_BATCH_SIZE:100}
sync.scheduler.pool-size=${SYNC_SCHEDULER_POOL_SIZE:4}

# Source/job lock TTL
sync.lock.ttl-seconds=${SYNC_LOCK_TTL_SECONDS:1800}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=${HEALTH_SHOW_DETAILS:never}
